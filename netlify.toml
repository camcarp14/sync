[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# A single-page app: every path that isn't a real file is the app itself.
# The functions rule sits first so /.netlify/* is never swallowed by it.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Everything under /assets is content-hashed by Vite — JS, CSS and the Inter
# woff2 files alike — so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The microphone is the whole product; everything else stays off.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=()"
