name: Verify and deploy

# Every push to main runs the full check suite and, if it passes, publishes.
# The gate is deliberate: a broken build should never reach the live URL, and
# `npm run verify` is the same command used locally — 327 checks plus the
# production build, no CI-only variant to drift out of sync.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight one, but a deploy already underway is
# allowed to finish rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Smoke suites first, then the production build — `verify` runs both, so
      # a failure here is a failure a developer would have seen locally.
      - name: Run the check suite
        run: npm run verify

      # `enablement: true` turns Pages on by itself wherever the workflow token
      # is allowed to, so a fresh fork deploys without anyone opening settings.
      # Where it isn't allowed, this step fails with "Resource not accessible
      # by integration" and Pages has to be switched on once by hand:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # After that one click every push deploys, and this step is a no-op.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
