<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>SYNC</title>
    <meta name="description" content="A voice-first operating layer for the workday. Talk to it; it plans, executes, and keeps the day moving." />

    <!-- The status bar and the OS chrome take the room's colour. The value is
         rewritten by src/theme.js the moment the stored theme resolves, so the
         notch never flashes the wrong room. -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SYNC" />
    <!-- Every href here is relative, and the build sets base to "./". That is
         what lets one build run at a domain root and at /sync/ on GitHub Pages
         without a rebuild. Inter is imported from src rather than public, so
         Vite fingerprints it and rewrites the URL to match. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />

    <!-- Resolve the room before first paint. Without this the app renders one
         frame of OBSIDIAN on a machine set to QUARTZ — a visible white/black
         flash on every cold load. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("sync.state.v1") || "null");
          var t = (s && s.settings && s.settings.theme) || "auto";
          if (t === "auto") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night";
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "day" ? "#F1F3F6" : "#000000");
        } catch (e) { /* first run, or storage blocked — OBSIDIAN is the default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
